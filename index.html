<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Monitor</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --ok:#16a34a; --bad:#dc2626; --accent:#ea580c; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa0a6; --border:#2e333b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:20px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.muted { color:var(--muted); margin:0; font-size:14px; }
  .stage { position:relative; width:100%; max-width:640px; margin:0 auto; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:4/3; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  #badge { position:absolute; top:10px; inset-inline-start:10px; padding:6px 12px; border-radius:8px; font-weight:600; background:var(--ok); color:#fff; }
  #badge.bad { background:var(--bad); }
  #debug { position:absolute; bottom:8px; inset-inline-start:10px; font:12px monospace; color:#fff; background:rgba(0,0,0,.55); padding:3px 8px; border-radius:6px; direction:ltr; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  button { font:inherit; padding:9px 18px; border-radius:8px; border:0; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  label.consent { display:flex; gap:8px; align-items:flex-start; font-size:14px; }
  #events { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .ev { border:1px solid var(--border); border-radius:8px; overflow:hidden; font-size:12px; }
  .ev img { width:100%; display:block; }
  .ev div { padding:6px 8px; }
  .count { font-size:28px; font-weight:700; color:var(--accent); }
  #msg { color:var(--bad); font-size:14px; min-height:20px; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>مراقبة المقابلة / الامتحان</h1>
    <p class="muted">الكشف بيشتغل جوه المتصفح، والفيديو مبيتبعتش لأي سيرفر. الأحداث دي محتاجة مراجعة بشرية وهي مش دليل على الغش.</p>
  </section>

  <section class="card">
    <label class="consent">
      <input type="checkbox" id="consent">
      <span>أوافق على تشغيل الكاميرا لمراقبة الجلسة (إشعار الخصوصية).</span>
    </label>
    <div class="row" style="margin-top:12px">
      <div>
        <button id="startBtn" disabled>ابدأ الجلسة</button>
        <button id="stopBtn" class="secondary" disabled>إنهاء</button>
      </div>
      <div>الأحداث المحتملة: <span class="count" id="count">0</span></div>
    </div>
    <div id="msg"></div>
  </section>

  <section class="card">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div id="badge">OK</div>
      <div id="debug">head=0.00 gaze=0.00</div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <strong>اللقطات المسجلة</strong>
      <button id="dlBtn" class="secondary" disabled>تنزيل التقرير (JSON)</button>
    </div>
    <div id="events"></div>
  </section>
</main>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---- Settings (same values as monitor.py) ----
const MODEL_PATH = "face_landmarker.task";
const HEAD_TURN_LIMIT = 0.20;
const GAZE_LIMIT = 0.10;
const SUSPICIOUS_SECONDS = 1.0;
const COOLDOWN_SECONDS = 2.0;
const GRACE_SECONDS = 0.7;

const $ = (id) => document.getElementById(id);
const video = $("video"), badge = $("badge"), debug = $("debug");
const startBtn = $("startBtn"), stopBtn = $("stopBtn"), dlBtn = $("dlBtn");
const msg = $("msg");

let landmarker = null, stream = null, running = false;
let suspiciousSince = null, lastSaved = 0, lastSeenBad = 0, eventsCount = 0;
let lastVideoTime = -1;
const events = [];

$("consent").addEventListener("change", (e) => { startBtn.disabled = !e.target.checked; });

// Same math as analyze_face() in monitor.py
function analyzeFace(lm) {
  const left = lm[234].x, right = lm[454].x, nose = lm[1].x;
  const faceW = Math.max(right - left, 1e-6);
  const head = ((nose - left) / faceW) - 0.5;

  const eyeRatio = (iris, c1, c2) => {
    const a = lm[c1].x, b = lm[c2].x;
    const w = Math.max(Math.abs(b - a), 1e-6);
    return ((lm[iris].x - Math.min(a, b)) / w) - 0.5;
  };
  const gaze = (eyeRatio(468, 33, 133) + eyeRatio(473, 362, 263)) / 2;
  return [head, gaze];
}

function saveCapture(reason) {
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  const dataUrl = c.toDataURL("image/jpeg", 0.8);
  const time = new Date();
  events.push({ time: time.toISOString(), reason, image: dataUrl });

  const el = document.createElement("div");
  el.className = "ev";
  el.innerHTML = `<img src="${dataUrl}" alt="${reason}"><div><b>${reason}</b><br>${time.toLocaleTimeString()}</div>`;
  $("events").prepend(el);
  dlBtn.disabled = false;
  // TODO: send { time, reason, image } to your server here (fetch POST)
}

function setBadge(text, bad) {
  badge.textContent = text;
  badge.classList.toggle("bad", bad);
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = landmarker.detectForVideo(video, performance.now());
    const faces = result.faceLandmarks;
    let reason = null;

    if (faces.length === 0) reason = "no_face";
    else if (faces.length > 1) reason = "multiple_faces";
    else {
      const [head, gaze] = analyzeFace(faces[0]);
      debug.textContent = `head=${head.toFixed(2)} gaze=${gaze.toFixed(2)}`;
      if (Math.abs(head) > HEAD_TURN_LIMIT) reason = "head_turned";
      else if (Math.abs(gaze) > GAZE_LIMIT) reason = "looking_away";
    }

    const now = performance.now() / 1000;
    if (reason) {
      lastSeenBad = now;
      if (suspiciousSince === null) suspiciousSince = now;
      const elapsed = now - suspiciousSince;
      setBadge("WARNING: " + reason, true);
      if (elapsed >= SUSPICIOUS_SECONDS && now - lastSaved >= COOLDOWN_SECONDS) {
        saveCapture(reason);
        lastSaved = now;
        eventsCount++;
        $("count").textContent = eventsCount;
      }
    } else {
      if (suspiciousSince !== null && now - lastSeenBad > GRACE_SECONDS) suspiciousSince = null;
      setBadge("OK", false);
    }
  }
  requestAnimationFrame(loop);
}

async function start() {
  msg.textContent = "";
  startBtn.disabled = true;
  try {
    if (!landmarker) {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      landmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_PATH },
        runningMode: "VIDEO",
        numFaces: 2
      });
    }
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await video.play();
    running = true;
    stopBtn.disabled = false;
    $("consent").disabled = true;
    requestAnimationFrame(loop);
  } catch (err) {
    msg.textContent = "خطأ: " + (err.message || err) + " (لازم تفتح الصفحة من سيرفر محلي أو HTTPS، ومعاها face_landmarker.task)";
    startBtn.disabled = false;
  }
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  video.srcObject = null;
  stopBtn.disabled = true;
  startBtn.disabled = !$("consent").checked;
  $("consent").disabled = false;
  setBadge("OK", false);
}

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);

dlBtn.addEventListener("click", () => {
  const report = { potential_events: eventsCount, events, note: "These events need human review; they are not proof of misconduct." };
  const blob = new Blob([JSON.stringify(report)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "session_report.json";
  a.click();
});
</script>
</body>
</html>
